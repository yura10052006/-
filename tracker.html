<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🏋️ Трекер важкоатлета</title>
<style>
:root{
  --bg:#0f1115; --card:#1b1f27; --text:#f5f6f8; --hint:#8b93a3;
  --accent:#e8662a; --accent-text:#fff; --border:rgba(255,255,255,.08); --danger:#e2483d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:76px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h1{font-size:18px;margin:0}
.lang-btn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600}
main{padding:0 16px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:4px 0 12px}
h3{font-size:14px;margin:0 0 8px}
.hint{color:var(--hint);font-size:13px;line-height:1.45}
label{display:block;font-size:12px;color:var(--hint);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--accent);color:var(--accent-text);border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.ghost{background:transparent;color:var(--accent);border:1px dashed var(--border)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.small{width:auto;padding:8px 12px;font-size:13px;margin:0}
.entry-row{display:grid;grid-template-columns:1fr 64px 56px 56px 32px;gap:6px;align-items:end;margin-bottom:8px}
.entry-row .del{background:transparent;border:none;color:var(--danger);font-size:20px;padding:8px 0}
.mini-label{font-size:10px;color:var(--hint)}
.workout{border-left:3px solid var(--accent)}
.workout .w-head{display:flex;justify-content:space-between;align-items:center}
.w-date{font-weight:700}
.w-entry{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-top:1px solid var(--border)}
.w-entry .vol{color:var(--hint);font-size:12px}
.tag{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px 8px;font-size:12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center}
.stat .num{font-size:26px;font-weight:800;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--hint)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.bar .name{width:84px;color:var(--hint);flex-shrink:0}
.bar .track{flex:1;background:var(--bg);border-radius:6px;height:16px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .val{width:70px;text-align:right}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--border)}
.tab{flex:1;background:none;border:none;color:var(--hint);padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px}
.tab span{font-size:19px}
.tab.active{color:var(--accent)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.week-block{margin-bottom:16px}
.week-title{font-weight:700;color:var(--accent);margin:8px 0}
.day-block{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:8px}
.day-title{font-size:13px;font-weight:600;margin-bottom:6px}
.prog-item{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.prog-item .calc{color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--hint);padding:30px 10px}
</style>
</head>
<body>
<header class="topbar">
  <h1 id="appTitle">🏋️</h1>
  <button id="langBtn" class="lang-btn" title="Language">UK / EN</button>
</header>
<main id="screen"></main>
<nav class="tabbar">
  <button class="tab" data-tab="log"><span>📒</span><em data-i18n="tabLog"></em></button>
  <button class="tab" data-tab="program"><span>📋</span><em data-i18n="tabProgram"></em></button>
  <button class="tab" data-tab="progress"><span>📈</span><em data-i18n="tabProgress"></em></button>
  <button class="tab" data-tab="records"><span>🏅</span><em data-i18n="tabRecords"></em></button>
  <button class="tab" data-tab="calc"><span>🧮</span><em data-i18n="tabCalc"></em></button>
</nav>
<div id="toast" class="toast"></div>

<script>
// ====================== ПЕРЕКЛАДИ / TRANSLATIONS ======================
const I18N={
 uk:{appTitle:'🏋️ Трекер важкоатлета',tabLog:'Журнал',tabProgram:'Програма',tabProgress:'Прогрес',tabRecords:'Рекорди',tabCalc:'Калькулятор',
  addWorkout:'➕ Нове тренування',date:'Дата',notes:'Нотатки',exercise:'Вправа',weight:'Вага, кг',reps:'Повтори',sets:'Підходи',
  addExercise:'➕ Додати вправу',save:'Зберегти',cancel:'Скасувати',delete:'Видалити',noWorkouts:'Ще немає тренувань. Додайте перше!',
  confirmDelete:'Видалити це тренування?',workoutSaved:'Тренування збережено ✅',fillExercises:'Додайте хоча б одну вправу',
  programHint:'Ваги нижче розраховані від ваших рекордів (1ПМ). Встановіть рекорди у вкладці «Рекорди».',
  totalWorkouts:'Тренувань',totalTonnage:'Загальний тоннаж',tonnageOverTime:'Тоннаж по днях',exerciseProgress:'Прогрес у вправі',noData:'Поки немає даних',kg:'кг',
  yourRecords:'Ваші рекорди (1ПМ)',recordValue:'1ПМ, кг',saveRecord:'Зберегти',noRecords:'Рекордів ще немає',
  calcTitle:'Калькулятор 1ПМ та відсотків',calcWeight:'Вага, кг',calcReps:'Повтори',calc1rm:'Розрахунковий 1ПМ',calcPercentTable:'Робочі ваги від 1ПМ',calcFormulaNote:'Формула Еплі'},
 en:{appTitle:'🏋️ Weightlifting Tracker',tabLog:'Log',tabProgram:'Program',tabProgress:'Progress',tabRecords:'Records',tabCalc:'Calculator',
  addWorkout:'➕ New workout',date:'Date',notes:'Notes',exercise:'Exercise',weight:'Weight, kg',reps:'Reps',sets:'Sets',
  addExercise:'➕ Add exercise',save:'Save',cancel:'Cancel',delete:'Delete',noWorkouts:'No workouts yet. Add your first!',
  confirmDelete:'Delete this workout?',workoutSaved:'Workout saved ✅',fillExercises:'Add at least one exercise',
  programHint:'Weights below are calculated from your records (1RM). Set them in the “Records” tab.',
  totalWorkouts:'Workouts',totalTonnage:'Total tonnage',tonnageOverTime:'Tonnage by day',exerciseProgress:'Exercise progress',noData:'No data yet',kg:'kg',
  yourRecords:'Your records (1RM)',recordValue:'1RM, kg',saveRecord:'Save',noRecords:'No records yet',
  calcTitle:'1RM & percentage calculator',calcWeight:'Weight, kg',calcReps:'Reps',calc1rm:'Estimated 1RM',calcPercentTable:'Working weights from 1RM',calcFormulaNote:'Epley formula'}
};

// ====================== ВПРАВИ ТА ПРОГРАМА / EXERCISES & PROGRAM ======================
const EXERCISES=[
 {key:'snatch',uk:'Ривок',en:'Snatch'},{key:'power_snatch',uk:'Ривок у стійку',en:'Power Snatch'},
 {key:'clean_and_jerk',uk:'Поштовх',en:'Clean & Jerk'},{key:'clean',uk:'Взяття на груди',en:'Clean'},
 {key:'power_clean',uk:'Взяття у стійку',en:'Power Clean'},{key:'jerk',uk:'Поштовх від грудей',en:'Jerk'},
 {key:'front_squat',uk:'Присід зі штангою спереду',en:'Front Squat'},{key:'back_squat',uk:'Присід зі штангою на спині',en:'Back Squat'},
 {key:'overhead_squat',uk:'Присід зі штангою над головою',en:'Overhead Squat'},{key:'snatch_pull',uk:'Ривкова тяга',en:'Snatch Pull'},
 {key:'clean_pull',uk:'Поштовхова тяга',en:'Clean Pull'},{key:'deadlift',uk:'Станова тяга',en:'Deadlift'},
 {key:'push_press',uk:'Швунг жимовий',en:'Push Press'},{key:'press',uk:'Жим стоячи',en:'Overhead Press'}
];
const PROGRAM={name:{uk:'Класичний цикл (4 тижні)',en:'Classic Cycle (4 weeks)'},
 description:{uk:'Базовий 4-тижневий цикл для важкоатлетів: ривок, поштовх, присіди та тяги. Ваги розраховуються від вашого 1ПМ. Останній тиждень — розвантаження.',
  en:'A base 4-week weightlifting cycle: snatch, clean & jerk, squats and pulls. Weights are based on your 1RM. The last week is a deload.'},
 weeks:[
 {label:{uk:'Тиждень 1 — обʼєм',en:'Week 1 — Volume'},days:[
  {day:{uk:'День 1',en:'Day 1'},items:[{exercise:'snatch',sets:5,reps:3,percent:70},{exercise:'clean_and_jerk',sets:5,reps:2,percent:70},{exercise:'back_squat',sets:4,reps:5,percent:75}]},
  {day:{uk:'День 2',en:'Day 2'},items:[{exercise:'power_snatch',sets:5,reps:3,percent:65},{exercise:'clean_pull',sets:4,reps:4,percent:90},{exercise:'front_squat',sets:4,reps:4,percent:70}]},
  {day:{uk:'День 3',en:'Day 3'},items:[{exercise:'snatch',sets:4,reps:2,percent:75},{exercise:'clean_and_jerk',sets:4,reps:2,percent:75},{exercise:'snatch_pull',sets:4,reps:4,percent:90}]}]},
 {label:{uk:'Тиждень 2 — інтенсивність',en:'Week 2 — Intensity'},days:[
  {day:{uk:'День 1',en:'Day 1'},items:[{exercise:'snatch',sets:5,reps:2,percent:78},{exercise:'clean_and_jerk',sets:5,reps:1,percent:80},{exercise:'back_squat',sets:5,reps:3,percent:82}]},
  {day:{uk:'День 2',en:'Day 2'},items:[{exercise:'power_clean',sets:5,reps:2,percent:72},{exercise:'push_press',sets:4,reps:3,percent:75},{exercise:'front_squat',sets:4,reps:3,percent:78}]},
  {day:{uk:'День 3',en:'Day 3'},items:[{exercise:'snatch',sets:5,reps:1,percent:82},{exercise:'clean_and_jerk',sets:5,reps:1,percent:82},{exercise:'clean_pull',sets:4,reps:3,percent:95}]}]},
 {label:{uk:'Тиждень 3 — пік',en:'Week 3 — Peak'},days:[
  {day:{uk:'День 1',en:'Day 1'},items:[{exercise:'snatch',sets:4,reps:1,percent:85},{exercise:'clean_and_jerk',sets:4,reps:1,percent:85},{exercise:'back_squat',sets:4,reps:2,percent:88}]},
  {day:{uk:'День 2',en:'Day 2'},items:[{exercise:'power_snatch',sets:4,reps:2,percent:75},{exercise:'jerk',sets:4,reps:2,percent:80},{exercise:'front_squat',sets:3,reps:2,percent:85}]},
  {day:{uk:'День 3',en:'Day 3'},items:[{exercise:'snatch',sets:3,reps:1,percent:90},{exercise:'clean_and_jerk',sets:3,reps:1,percent:90},{exercise:'snatch_pull',sets:3,reps:3,percent:100}]}]},
 {label:{uk:'Тиждень 4 — розвантаження',en:'Week 4 — Deload'},days:[
  {day:{uk:'День 1',en:'Day 1'},items:[{exercise:'snatch',sets:3,reps:2,percent:60},{exercise:'clean_and_jerk',sets:3,reps:2,percent:60},{exercise:'back_squat',sets:3,reps:4,percent:65}]},
  {day:{uk:'День 2',en:'Day 2'},items:[{exercise:'power_snatch',sets:3,reps:3,percent:55},{exercise:'front_squat',sets:3,reps:3,percent:60}]},
  {day:{uk:'День 3 (контроль)',en:'Day 3 (test)'},items:[{exercise:'snatch',sets:1,reps:1,percent:95},{exercise:'clean_and_jerk',sets:1,reps:1,percent:95}]}]}
 ]};

// ====================== СХОВИЩЕ / STORAGE (localStorage) ======================
const KEY='wl_tracker_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
let db=load();
db.lang=db.lang||'uk';
db.workouts=db.workouts||[];   // [{id,date,notes,entries:[{exercise,weight,reps,sets}]}]
db.records=db.records||{};      // {exerciseKey:{value,date}}

const state={tab:'log',lang:db.lang};
const exMap=Object.fromEntries(EXERCISES.map(e=>[e.key,e]));

// ====================== ХЕЛПЕРИ / HELPERS ======================
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,props={},...kids)=>{const n=document.createElement(tag);
 Object.entries(props).forEach(([k,v])=>{if(k==='class')n.className=v;else if(k==='html')n.innerHTML=v;
  else if(k.startsWith('on')&&typeof v==='function')n.addEventListener(k.slice(2),v);
  else if(v!=null)n.setAttribute(k,v)});
 kids.flat().forEach(c=>n.append(c.nodeType?c:document.createTextNode(c)));return n};
const t=k=>(I18N[state.lang]&&I18N[state.lang][k])||k;
const exName=k=>exMap[k]?exMap[k][state.lang]:k;
const today=()=>new Date().toISOString().slice(0,10);
const epley1RM=(w,r)=>r<=1?w:w*(1+r/30);
let toastTimer;
function toast(m){const b=$('#toast');b.textContent=m;b.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>b.classList.remove('show'),1800)}

function applyI18n(){document.documentElement.lang=state.lang;$('#appTitle').textContent=t('appTitle');
 document.querySelectorAll('[data-i18n]').forEach(n=>{n.textContent=t(n.dataset.i18n)})}

// ====================== СТАТИСТИКА / STATS ======================
function computeStats(){
 let total=0;const tonByDate={};const progress={};
 for(const w of db.workouts){const dayMax={};
  for(const e of w.entries){const vol=e.weight*e.reps*e.sets;total+=vol;
   tonByDate[w.date]=(tonByDate[w.date]||0)+vol;
   if(!dayMax[e.exercise]||e.weight>dayMax[e.exercise])dayMax[e.exercise]=e.weight}
  for(const[ex,mw]of Object.entries(dayMax))(progress[ex]=progress[ex]||[]).push({date:w.date,weight:mw})}
 for(const ex in progress)progress[ex].sort((a,b)=>a.date.localeCompare(b.date));
 return{workoutsCount:db.workouts.length,totalTonnage:Math.round(total),tonByDate,progress}}

// ====================== РЕНДЕР / RENDER ======================
const screen=()=>$('#screen');
function render(){applyI18n();
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
 const map={log:renderLog,program:renderProgram,progress:renderProgress,records:renderRecords,calc:renderCalc};
 screen().innerHTML='';(map[state.tab]||renderLog)()}

// ---- ЖУРНАЛ ----
function renderLog(){const s=screen();
 s.append(el('button',{class:'btn',onclick:openWorkoutForm},t('addWorkout')));
 if(db.workouts.length===0){s.append(el('div',{class:'empty'},t('noWorkouts')));return}
 const sorted=db.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 for(const w of sorted){const card=el('div',{class:'card workout'});
  card.append(el('div',{class:'w-head'},el('span',{class:'w-date'},w.date),
   el('button',{class:'btn danger small',onclick:()=>deleteWorkout(w.id)},'🗑')));
  if(w.notes)card.append(el('div',{class:'hint',style:'margin:4px 0'},w.notes));
  for(const e of w.entries){const vol=e.weight*e.reps*e.sets;
   card.append(el('div',{class:'w-entry'},el('span',{},exName(e.exercise)),
    el('span',{},el('span',{class:'tag'},`${e.sets}×${e.reps} · ${e.weight}${t('kg')}`),
     el('span',{class:'vol',style:'margin-left:8px'},`${Math.round(vol)} ${t('kg')}`))))}
  s.append(card)}}

function openWorkoutForm(){const s=screen();s.innerHTML='';const form=el('div',{class:'card'});
 form.append(el('h2',{},t('addWorkout')));
 form.append(el('label',{},t('date')));const dateInput=el('input',{type:'date',value:today()});form.append(dateInput);
 form.append(el('label',{},t('notes')));const notesInput=el('input',{type:'text',placeholder:t('notes')});form.append(notesInput);
 form.append(el('label',{},t('exercise')));const list=el('div',{});form.append(list);
 const addRow=()=>{const select=el('select',{});EXERCISES.forEach(ex=>select.append(el('option',{value:ex.key},ex[state.lang])));
  const wIn=el('input',{type:'number',step:'0.5',min:'0',value:'0'});const rIn=el('input',{type:'number',min:'1',value:'3'});const sIn=el('input',{type:'number',min:'1',value:'5'});
  const row=el('div',{class:'entry-row'},el('div',{},el('span',{class:'mini-label'},t('exercise')),select),
   el('div',{},el('span',{class:'mini-label'},t('weight')),wIn),el('div',{},el('span',{class:'mini-label'},t('reps')),rIn),
   el('div',{},el('span',{class:'mini-label'},t('sets')),sIn),el('button',{class:'del',onclick:()=>row.remove()},'×'));
  list.append(row)};
 addRow();
 form.append(el('button',{class:'btn ghost',onclick:addRow},t('addExercise')));
 form.append(el('button',{class:'btn',onclick:()=>{
  const entries=[...list.querySelectorAll('.entry-row')].map(row=>{const[sel,w,r,st]=row.querySelectorAll('select, input');
   return{exercise:sel.value,weight:parseFloat(w.value)||0,reps:parseInt(r.value)||1,sets:parseInt(st.value)||1}});
  if(entries.length===0)return toast(t('fillExercises'));
  db.workouts.push({id:Date.now(),date:dateInput.value,notes:notesInput.value,entries});persist();
  toast(t('workoutSaved'));state.tab='log';render()}},t('save')));
 form.append(el('button',{class:'btn secondary',onclick:render},t('cancel')));s.append(form)}

function deleteWorkout(id){if(confirm(t('confirmDelete'))){db.workouts=db.workouts.filter(w=>w.id!==id);persist();render()}}

// ---- ПРОГРАМА ----
function renderProgram(){const s=screen();const p=PROGRAM;
 const head=el('div',{class:'card'});head.append(el('h2',{},p.name[state.lang]));
 head.append(el('div',{class:'hint'},p.description[state.lang]));
 head.append(el('div',{class:'hint',style:'margin-top:8px'},t('programHint')));s.append(head);
 for(const week of p.weeks){const block=el('div',{class:'week-block'});
  block.append(el('div',{class:'week-title'},week.label[state.lang]));
  for(const day of week.days){const d=el('div',{class:'day-block'});
   d.append(el('div',{class:'day-title'},day.day[state.lang]));
   for(const item of day.items){const rec=db.records[item.exercise];const rm=rec?rec.value:0;
    const calc=rm?`${Math.round(rm*item.percent/100)} ${t('kg')}`:`— ${t('kg')}`;
    d.append(el('div',{class:'prog-item'},el('span',{},`${exName(item.exercise)} · ${item.sets}×${item.reps} · ${item.percent}%`),
     el('span',{class:'calc'},calc)))}
   block.append(d)}s.append(block)}}

// ---- ПРОГРЕС ----
function renderProgress(){const s=screen();const st=computeStats();
 s.append(el('div',{class:'card stat-grid'},
  el('div',{class:'stat'},el('div',{class:'num'},String(st.workoutsCount)),el('div',{class:'lbl'},t('totalWorkouts'))),
  el('div',{class:'stat'},el('div',{class:'num'},String(st.totalTonnage)),el('div',{class:'lbl'},`${t('totalTonnage')} (${t('kg')})`))));
 const dates=Object.keys(st.tonByDate).sort();
 if(dates.length){const card=el('div',{class:'card'});card.append(el('h3',{},t('tonnageOverTime')));
  const max=Math.max(...dates.map(d=>st.tonByDate[d]));
  dates.slice(-12).forEach(d=>{const v=st.tonByDate[d];card.append(el('div',{class:'bar'},
   el('span',{class:'name'},d.slice(5)),el('span',{class:'track'},el('span',{class:'fill',style:`width:${v/max*100}%`})),
   el('span',{class:'val'},`${Math.round(v)}`)))});s.append(card)}
 const card=el('div',{class:'card'});card.append(el('h3',{},t('exerciseProgress')));
 const keys=Object.keys(st.progress);
 if(!keys.length){card.append(el('div',{class:'empty'},t('noData')));s.append(card);return}
 const sel=el('select',{});keys.forEach(k=>sel.append(el('option',{value:k},exName(k))));card.append(sel);
 const chart=el('div',{style:'margin-top:10px'});card.append(chart);
 const draw=()=>{chart.innerHTML='';const pts=st.progress[sel.value];const max=Math.max(...pts.map(p=>p.weight));
  pts.slice(-12).forEach(p=>chart.append(el('div',{class:'bar'},el('span',{class:'name'},p.date.slice(5)),
   el('span',{class:'track'},el('span',{class:'fill',style:`width:${p.weight/max*100}%`})),
   el('span',{class:'val'},`${p.weight} ${t('kg')}`))))};
 sel.addEventListener('change',draw);draw();s.append(card)}

// ---- РЕКОРДИ ----
function renderRecords(){const s=screen();const card=el('div',{class:'card'});card.append(el('h2',{},t('yourRecords')));
 const sel=el('select',{});EXERCISES.forEach(ex=>sel.append(el('option',{value:ex.key},ex[state.lang])));
 const valIn=el('input',{type:'number',step:'0.5',min:'0',placeholder:t('recordValue')});
 card.append(el('label',{},t('exercise')));card.append(sel);card.append(el('label',{},t('recordValue')));card.append(valIn);
 card.append(el('button',{class:'btn',onclick:()=>{const v=parseFloat(valIn.value);if(!(v>0))return;
  db.records[sel.value]={value:v,date:today()};persist();valIn.value='';render()}},t('saveRecord')));s.append(card);
 const recs=Object.entries(db.records);
 if(!recs.length){s.append(el('div',{class:'empty'},t('noRecords')));return}
 const list=el('div',{class:'card'});
 recs.sort((a,b)=>b[1].value-a[1].value).forEach(([k,r])=>list.append(el('div',{class:'w-entry'},
  el('span',{},exName(k)),el('span',{},el('span',{class:'tag'},`${r.value} ${t('kg')}`),
   el('button',{class:'del',style:'margin-left:8px',onclick:()=>{delete db.records[k];persist();render()}},'×')))));
 s.append(list)}

// ---- КАЛЬКУЛЯТОР ----
function renderCalc(){const s=screen();const card=el('div',{class:'card'});card.append(el('h2',{},t('calcTitle')));
 const wIn=el('input',{type:'number',step:'0.5',min:'0',value:'100'});const rIn=el('input',{type:'number',min:'1',value:'3'});
 card.append(el('label',{},t('calcWeight')));card.append(wIn);card.append(el('label',{},t('calcReps')));card.append(rIn);
 const result=el('div',{class:'stat',style:'margin-top:14px'});card.append(result);
 const table=el('div',{style:'margin-top:14px'});card.append(table);
 const recompute=()=>{const w=parseFloat(wIn.value)||0;const r=parseInt(rIn.value)||1;const orm=epley1RM(w,r);
  result.innerHTML='';result.append(el('div',{class:'num'},`${orm.toFixed(1)} ${t('kg')}`),
   el('div',{class:'lbl'},`${t('calc1rm')} · ${t('calcFormulaNote')}`));
  table.innerHTML='';table.append(el('h3',{},t('calcPercentTable')));
  [95,90,85,80,75,70,65,60].forEach(pct=>table.append(el('div',{class:'bar'},el('span',{class:'name'},`${pct}%`),
   el('span',{class:'track'},el('span',{class:'fill',style:`width:${pct}%`})),
   el('span',{class:'val'},`${(orm*pct/100).toFixed(1)} ${t('kg')}`))))};
 wIn.addEventListener('input',recompute);rIn.addEventListener('input',recompute);recompute();s.append(card)}

// ====================== СТАРТ / BOOTSTRAP ======================
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render()}));
$('#langBtn').addEventListener('click',()=>{state.lang=state.lang==='uk'?'en':'uk';db.lang=state.lang;persist();render()});
render();
</script>
