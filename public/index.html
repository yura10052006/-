<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Weightlifting Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="appTitle">🏋️</h1>
    <button id="langBtn" class="lang-btn" title="Language">UK / EN</button>
  </header>

  <main id="screen"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="log"><span>📒</span><em data-i18n="tabLog"></em></button>
    <button class="tab" data-tab="program"><span>📋</span><em data-i18n="tabProgram"></em></button>
    <button class="tab" data-tab="progress"><span>📈</span><em data-i18n="tabProgress"></em></button>
    <button class="tab" data-tab="records"><span>🏅</span><em data-i18n="tabRecords"></em></button>
    <button class="tab" data-tab="calc"><span>🧮</span><em data-i18n="tabCalc"></em></button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
